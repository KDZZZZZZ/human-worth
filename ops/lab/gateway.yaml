apiVersion: v1
kind: ServiceAccount
metadata: {name: gateway, namespace: human-worth}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata: {name: gateway, namespace: human-worth}
spec:
  type: NodePort
  selector: {app: gateway}
  ports: [{name: https, port: 443, targetPort: https, nodePort: 30443}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: gateway, namespace: human-worth}
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector: {matchLabels: {app: gateway}}
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata: {labels: {app: gateway}}
    spec:
      serviceAccountName: gateway
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      nodeSelector: {human-worth.io/worker: "true"}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector: {matchLabels: {app: gateway}}
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: gateway
          image: human-worth/gateway:local
          imagePullPolicy: Never
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 400m, memory: 192Mi}
          env:
            - {name: PUBLIC_ORIGIN, value: "https://worth.oopsbox.cn"}
            - {name: IDENTITY_TARGET, value: "dns:///identity.human-worth.svc.cluster.local:8443"}
            - {name: CONTENT_TARGET, value: "dns:///content.human-worth.svc.cluster.local:8443"}
            - {name: DEPLOYMENT_STATUS_FILE, value: /deployment/status.json}
            - {name: SERVICE_CERT_FILE, value: /tls/tls.crt}
            - {name: SERVICE_KEY_FILE, value: /tls/tls.key}
            - {name: SERVICE_CA_FILE, value: /tls/ca.crt}
            - {name: HTTP_TLS_CERT_FILE, value: /tls/tls.crt}
            - {name: HTTP_TLS_KEY_FILE, value: /tls/tls.key}
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: GOMEMLIMIT, value: 150MiB}
          ports: [{name: https, containerPort: 8080}, {name: health, containerPort: 8081}]
          startupProbe: {httpGet: {path: /livez, port: health}, periodSeconds: 2, failureThreshold: 30}
          livenessProbe: {httpGet: {path: /livez, port: health}, periodSeconds: 10}
          readinessProbe: {httpGet: {path: /readyz, port: health}, periodSeconds: 3, timeoutSeconds: 3, failureThreshold: 2}
          volumeMounts:
            - {name: tls, mountPath: /tls, readOnly: true}
            - {name: deployment-status, mountPath: /deployment, readOnly: true}
      # A directory mount receives updates after the controller finishes all modules.
      # optional supports the first release, before the completion marker exists.
      volumes:
        - {name: tls, secret: {secretName: gateway-tls, defaultMode: 0440}}
        - {name: deployment-status, configMap: {name: release-status, optional: true}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: gateway, namespace: human-worth}
spec:
  minAvailable: 1
  selector: {matchLabels: {app: gateway}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: gateway, namespace: human-worth}
spec:
  podSelector: {matchLabels: {app: gateway}}
  policyTypes: [Ingress, Egress]
  ingress:
    # Outer NodePort is bound only to host loopback by kind.
    - ports: [{protocol: TCP, port: 8080}]
  egress:
    - to: [{podSelector: {matchLabels: {app: identity}}}]
      ports: [{protocol: TCP, port: 8443}]
    - to: [{podSelector: {matchLabels: {app: content}}}]
      ports: [{protocol: TCP, port: 8443}]
