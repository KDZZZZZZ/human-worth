apiVersion: v1
kind: Namespace
metadata:
  name: human-worth
  labels:
    app.kubernetes.io/part-of: human-worth
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: lab-budget
  namespace: human-worth
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    # Allow Content's two replicas, one rolling replica and migration Jobs.
    limits.cpu: "6"
    limits.memory: 4Gi
    requests.storage: 8Gi
    pods: "24"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: container-defaults
  namespace: human-worth
spec:
  limits:
    - type: Container
      default: {cpu: 500m, memory: 256Mi}
      defaultRequest: {cpu: 50m, memory: 64Mi}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: human-worth
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: human-worth
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
