# Installed on the Aliyun gateway, not on the local application host.
server {
    listen 18090;
    server_name 123.56.161.234;
    server_tokens off;
    client_max_body_size 1m;
    location = /docs {
        return 308 /docs/;
    }
    location ^~ /docs/ {
        alias /var/www/human-worth-docs/current/;
        index index.html;
        autoindex off;
        types {
            text/html html;
            text/css css;
            application/javascript js;
            application/yaml yaml;
            application/json json;
            image/png png;
            text/plain txt;
        }
        default_type text/plain;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;
        gzip on;
        gzip_types text/css application/javascript application/yaml application/json;
    }
    # The gateway public socket must not share the tunnel loopback port.
    location / {
        proxy_pass http://127.0.0.1:28090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
