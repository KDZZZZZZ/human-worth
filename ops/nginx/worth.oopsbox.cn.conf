# Candidate Identity entry; install only after its approved dev release is healthy.
# The currently installed domain still proxies the foundation on HTTP port 28090.
# Do not include query strings or Referer in OAuth access logs.
log_format human_worth_safe '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent rt=$request_time';
server {
    listen 80;
    listen [::]:80;
    server_name worth.oopsbox.cn;
    access_log /var/log/nginx/human-worth-domain.access.log human_worth_safe;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/human-worth-acme;
    }
    location / {
        return 308 https://worth.oopsbox.cn$request_uri;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name worth.oopsbox.cn;
    ssl_certificate /etc/letsencrypt/live/worth.oopsbox.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/worth.oopsbox.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 16k;
    access_log /var/log/nginx/human-worth-domain.access.log human_worth_safe;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location = /docs { return 308 /docs/; }
    location ^~ /docs/ {
        alias /var/www/human-worth-docs/current/;
        index index.html;
        autoindex off;
        types {
            text/html html;
            text/css css;
            application/javascript js;
            application/yaml yaml;
            application/json json;
            image/png png;
            text/plain txt;
        }
        default_type text/plain;
        add_header Cache-Control no-cache always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;
    }
    location ^~ /api/auth/ {
        access_log off;
        error_log /dev/null crit;
        proxy_pass https://127.0.0.1:28443;
        proxy_ssl_server_name on;
        proxy_ssl_name worth.oopsbox.cn;
        proxy_ssl_trusted_certificate /etc/nginx/human-worth/lab-ca.crt;
        proxy_ssl_verify on;
        proxy_http_version 1.1;
        proxy_set_header Host worth.oopsbox.cn;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
    }
    location / {
        proxy_pass https://127.0.0.1:28443;
        proxy_ssl_server_name on;
        proxy_ssl_name worth.oopsbox.cn;
        proxy_ssl_trusted_certificate /etc/nginx/human-worth/lab-ca.crt;
        proxy_ssl_verify on;
        proxy_http_version 1.1;
        proxy_set_header Host worth.oopsbox.cn;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
    }
}
