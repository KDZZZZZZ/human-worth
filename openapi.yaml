  /api/tasks/{taskId}/ballot:
    parameters: [{$ref: '#/components/parameters/TaskId'}]
    get:
      tags: [Voting]
      operationId: getBallot
      summary: 一次获取该题全部过审作品供单选投票
      description: |
        一次返回同一目录版本下该任务全部审核通过、允许展示的作品，包含全部 human 和 agent 作品；不分页、不抽样、不做两件配对。
        服务端生成 ballotId（响应字段 id），绑定当前账号、任务、catalogRevision 及完整候选 ID 集合；作品文件按引用另行加载，不内嵌文件字节。
        用户从全部作品中单选一件最认可的；响应只含作品和本人的当前选票，不含其他人的选择、票数或得票占比。
        读取不提交选票、不改变永久资格；永久禁投返回 403。没有过审作品时仍返回 200 和空 entries，页面不能提交选票。
        必须从内容服务核实完整集合，目录未同步或不能确认完整性时返回 503，不能以旧的部分候选成功响应。
      x-scenarios: [S1, H1]
      x-implementation-status: planned
      security: [{WebSession: []}]
      responses:
        '200':
          description: 完整过审作品列表与本人的当前选票
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ballot'}
        '403': {$ref: '#/components/responses/Forbidden'}
        default: {$ref: '#/components/responses/Problem'}

  /api/tasks/{taskId}/vote:
    parameters: [{$ref: '#/components/parameters/TaskId'}]
    put:
      tags: [Voting]
      operationId: castVote
      summary: 从全部过审作品中单选一件最认可的作品
      description: |
        提交一个 entryId，不接受左右选项、平票、多选或评分；跳过不发送选票。
        技术提案：每账号每任务只保留一份当前选择；未永久禁投前可以改选，替换选择而不新增一票。
        ballotId 必须绑定当前账号、任务和完整候选集合；新写入时核实目录版本最新，entryId 仍在该题过审候选中。
        新作品过审或作品撤销通过导致目录版本变化时，新投票请求返回 409，客户端重新加载全部作品，不静默沿用旧候选。
        expectedVoteRevision 为本人当前选票版本，尚未投票时为 0；过期版本返回 409，避免迟到重试覆盖后来的选择。
        同请求最近一次成功结果的重试返回该选票，不重复计票；已永久禁投时即使重放旧票也返回 403。
        投票与 statistics-access 在账号 × 任务上串行化；资格关闭后不得新增或修改选择。关闭前已提交的选择保留。
        返回本人的选票，不返回统计；管理员身份不豁免，MCP token 无权投票。版本、改选与幂等细则为 Agent Self-Claimed。
      x-scenarios: [S1, S5, H1]
      x-implementation-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VoteInput'}
      responses:
        '200':
          description: 已保存的本人选票或相同选择的重试结果
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Vote'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        default: {$ref: '#/components/responses/Problem'}

  /api/tasks/{taskId}/statistics-access:
    parameters: [{$ref: '#/components/parameters/TaskId'}]
    post:
      tags: [Voting]
      operationId: accessTaskStatistics
      summary: 永久放弃该题后续投票权并查看统计
      description: |
        客户端必须先披露后果并取得用户明确选择，再发送 permanentlyCloseVoting=true；未确认返回 422，无副作用。
        先验证账号和任务可见性，再持久化账号 × 任务的永久禁投记录，提交成功后才读取并返回统计。
        持久化失败不返回统计；提交成功但响应丢失时禁投记录仍生效，重试不改变首次 closedAt，也不生成选票。
        换 token、刷新候选列表或新增作品都不能恢复资格；其他任务及追加作品权限不受影响。
        网站、MCP、榜单下钻和管理员具体反馈查看共用此流程，没有无副作用的 GET 统计旁路。
        Cookie 调用须同时提供 CSRF token；MCP Bearer 调用不使用 Cookie。响应及错误均不可缓存。
      x-scenarios: [S1, S3, S4, S5, S6]
      x-implementation-status: planned
      security:
        - WebSession: []
          CsrfToken: []
        - McpToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [permanentlyCloseVoting]
              properties:
                permanentlyCloseVoting:
                  type: boolean
                  const: true
                  description: 用户已明确选择永久放弃该题后续投票权；不得由预加载代码自动填入
            example: {permanentlyCloseVoting: true}
      responses:
        '200':
          description: 禁投记录提交后的统计快照；零票时得票占比为 null
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskStatistics'}
        '422': {$ref: '#/components/responses/InvalidSubmission'}
        default: {$ref: '#/components/responses/Problem'}

