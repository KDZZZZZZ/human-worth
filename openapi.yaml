            application/json:
              schema: {$ref: '#/components/schemas/EntrySubmission'}
        default: {$ref: '#/components/responses/Problem'}
    put:
      tags: [Submissions]
      operationId: resubmitRejectedEntry
      summary: 修改本人被驳回的追加作品并重新送审
      description: |
        仅被驳回且原任务仍公开的独立追加作品可重提；初始作品随任务整体修改。
        校验 expectedRevision，生成新审核记录并保留历史；其他状态或并发冲突返回 409。
        网络重试若携带同一旧版本和完全相同内容，找回该版本产生的重提结果，不再次投稿。
      x-scenarios: [S3]
      x-implementation-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EntryUpdate'}
      responses:
        '200':
          description: 新审核待办对应的作品投稿
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EntrySubmission'}
        default: {$ref: '#/components/responses/Problem'}

  /api/assets:
    post:
      tags: [Submissions]
      operationId: uploadAsset
      summary: 上传作品文件或压缩包
      description: |
        返回的资产初始仅上传者可读；引用资产须校验归属，不因上传自动公开。
        服务端检查实际类型、大小和恶意内容；压缩包按文件保存，不自动解压执行。
        文件白名单、大小上限及保留期在实现前确定；超限 413、不支持类型 415、内容不合法 422。
      x-scenarios: [S2, S3]
      x-implementation-status: planned
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '201':
          description: 已验证且可用于投稿的资产；被过审作品引用前仅供本人投稿管理与管理员审核
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Asset'}
        default: {$ref: '#/components/responses/Problem'}

  /api/assets/{assetId}:
    parameters:
      - name: assetId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Id'}
    get:
      tags: [Tasks]
      operationId: downloadAsset
      summary: 下载审核允许展示或本人有权管理的作品文件
      description: |
        任务可见且作品审核通过（approved），其关联文件即可供匿名、网站和 MCP 读取，不另设公开/私有或公开授权开关。
        尚未被可见任务中的过审作品引用的文件，仅上传者本人或平台管理员可通过网站会话在投稿管理/审核中读取；MCP token 不获得这项管理权限。
        撤销作品审核通过或任务下架后立即重新检查展示条件；资产自身被封禁时停止下载，不保留可绕过检查的长期下载 URL。
        无权访问与不存在均返回 404；cloudUse 只限制云端挑战用途，不影响过审作品的展示和普通下载。
        使用附件下载与 nosniff，不在站点源内执行用户上传的 HTML 或脚本。
      x-scenarios: [S2, S3, S4, S5, H1]
      x-implementation-status: planned
      security: [{}, {WebSession: []}, {McpToken: []}]
      responses:
        '200':
          description: 通过当前访问校验的原始文件字节
          headers:
            Content-Disposition:
              description: 附件文件名须经过转义
              schema: {type: string}
            X-Content-Type-Options:
              schema: {type: string, const: nosniff}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        default: {$ref: '#/components/responses/Problem'}

  /api/tasks/{taskId}/voting-eligibility:
