openapi: 3.1.1
info:
  title: Human Worth API
  version: 0.1.0-draft
  summary: 人类价值平台的 HTTP 接口契约草案
  description: |
    行为依据为 docs/prd.md 中的可信场景 S1～S6，以及 AGENTS.md 的发帖、评论、投票目标。
    当前仅 /api/health 的 GET、HEAD 已实现；其余 operation 均为 planned，不能据此认定线上可调用。
    路径、字段、状态枚举、认证载体和分页等具体选择属于 Agent Self-Claimed，详见 docs/references.md。

    普通 GET 不改变投票资格，不返回或预取单题得票、胜率；投票响应也不附带统计。
    只有显式 POST statistics-access 可以读取具体统计，且必须先持久化账号 × 任务的永久禁投记录。
    网站、MCP 和管理员查看单题具体统计均经过此入口；管理角色不能绕过资格变化。
    所有业务响应使用 Cache-Control: no-store；错误响应也不得泄露统计、密钥或私有内容。

    网站使用会话及 CSRF token；MCP token 仅用于公开内容读取和显式统计访问，不接受于投稿、投票或管理接口。
    账号和管理员身份由服务端认证取得，不接受客户端指定账号或角色。两种凭据必须映射到同一稳定账号 ID。
    公开操作允许不带凭据；携带无效凭据时返回 401，不退回匿名访问；同时携带会话与 Bearer 时返回 400。
    业务接口启用前须接入 HTTPS；现有公网 HTTP 仅用于建设中页面和健康检查。
    登录注册、token 签发/吊销、管理员授予、具体算法、文件限额及云端内部通信不在本草案中定案。
externalDocs:
  description: 产品需求与可信场景
  url: https://github.com/KDZZZZZZ/human-worth/blob/dev/docs/prd.md
servers:
  - url: /
    description: 同源部署；planned 接口尚不可调用，带凭据的业务请求必须使用 HTTPS
security:
  - WebSession: []
    CsrfToken: []
x-contract-authority: Agent Self-Claimed
x-mcp:
  description: |
    以下仅为本地 MCP 工具到 HTTP 操作的映射提案，不是 MCP 的 JSON-RPC 或传输协议定义。
    仅暴露下列三个工具；不要从本文件自动暴露全部 operation。
    工具注解是提示，服务端仍须执行账号、用途和权限检查。
  tools:
    list_tasks:
      operationId: listTasks
      readOnlyHint: true
    get_task:
      operationId: getTask
      readOnlyHint: true
      description: 仅公开任务内容；作品可通过公开读取接口加载，禁止隐式拉取统计。
    view_task_statistics:
      operationId: accessTaskStatistics
      readOnlyHint: false
      destructiveHint: true
      description: 客户端须先说明永久失去该题投票权，再以明确确认为参数调用；不提交选票。
tags:
  - {name: Health, description: 已实现的基础服务}
  - {name: Account, description: 当前会话和本人投稿}
  - {name: Tasks, description: 推荐发现、任务与公开作品}
  - {name: Submissions, description: 草稿、上传与审核申请}
  - {name: Voting, description: 真人比较与永久投票资格}
  - {name: Board, description: 公开看板与热度排行}
  - {name: Discussion, description: 评论及举报}
  - {name: Administration, description: 管理员审核、下架与审计}
  - {name: Challenges, description: 管理员云端挑战与公开进度}
paths:
  /api/health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: 获取基础服务健康状态
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: 当前进程可响应；不代表产品业务或云端挑战已实现
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
              example: {status: ok, service: human-worth, stage: foundation, revision: development}
    head:
      tags: [Health]
      operationId: headHealth
      summary: 检查基础服务是否可响应
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: 与 GET 相同的状态及响应头，无响应体
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            Content-Type:
              schema: {type: string, const: 'application/json; charset=utf-8'}

  /api/me:
    get:
      tags: [Account]
      operationId: getCurrentSession
      summary: 获取当前网站账号与 CSRF token
      x-scenarios: [S2, S3, S4, S5]
      x-implementation-status: planned
      security: [{WebSession: []}]
      responses:
        '200':
          description: 本人身份；csrfToken 仅用于当前网站会话的写请求
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        default: {$ref: '#/components/responses/Problem'}

  /api/tasks:
    get:
      tags: [Tasks]
      operationId: listTasks
      summary: 分页浏览公开任务
      description: |
        首页默认 recommended；看板排行榜使用 hot，按热度降序排列，同热度按任务 ID 升序。
        游标绑定排序、筛选及列表快照，持续滚动不重复同一任务；快照内已下架内容即时过滤。
        不返回具体得票或胜率，不因读取改变资格。heat 是不可反推出具体票数的排序分值。
        q 仅检索允许公开的任务文本，不检索私有投稿或统计。
      x-scenarios: [S1, S5, S6]
      x-implementation-status: planned
      security: [{}, {WebSession: []}, {McpToken: []}]
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - name: order
          in: query
          schema: {type: string, enum: [recommended, hot], default: recommended}
        - name: category
          in: query
          schema: {type: string, minLength: 1}
        - name: q
          in: query
          schema: {type: string, minLength: 1}
      responses:
        '200':
          description: 已审核发布任务；nextCursor 为 null 时没有后续页
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskPage'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Submissions]
      operationId: createTaskDraft
      summary: 保存新任务草稿
      description: 可缺少一方或双方作品，不进入公开查询或审核，不启动云端挑战。
      x-scenarios: [S2]
      x-implementation-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TaskDraftInput'}
      responses:
        '201':
          description: 本人草稿已保存
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskSubmission'}
        default: {$ref: '#/components/responses/Problem'}

  /api/tasks/{taskId}:
    parameters: [{$ref: '#/components/parameters/TaskId'}]
    get:
      tags: [Tasks]
      operationId: getTask
      summary: 阅读公开任务详情
      description: 只返回已发布任务；草稿、待审、驳回和下架内容返回 404。作品列表独立分页，不隐式读取统计。
      x-scenarios: [S1, S3, S5, S6]
      x-implementation-status: planned
      security: [{}, {WebSession: []}, {McpToken: []}]
      responses:
        '200':
          description: 公开任务正文，不含票数和胜率
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicTask'}
        default: {$ref: '#/components/responses/Problem'}

  /api/tasks/{taskId}/entries:
    parameters: [{$ref: '#/components/parameters/TaskId'}]
    get:
      tags: [Tasks]
      operationId: listPublishedEntries
      summary: 分页读取该题已发布作品
      description: 任务及作品均须公开可见；不暴露其他人的草稿、待审作品、私有配置或单题统计。
      x-scenarios: [S1, S3, S5]
      x-implementation-status: planned
      security: [{}, {WebSession: []}, {McpToken: []}]
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: 公开参选作品
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EntryPage'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Submissions]
      operationId: submitAdditionalEntry
      summary: 向任意公开任务追加一件作品并送审
      description: |
        任意网站用户可单方追加，不要求作者邀请或批准；即使已永久失去该题投票权也可投稿。
        仅新作品进入 pending_review，原任务保持 published。作品署名不能决定投稿者账号。
        校验资产归属、来源、授权及适用配置；不恢复投票资格，不启动云端挑战。
      x-scenarios: [S3]
      x-implementation-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EntryInput'}
      responses:
        '201':
          description: 新作品与独立审核记录已建立
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EntrySubmission'}
        default: {$ref: '#/components/responses/Problem'}

  /api/me/submissions:
    get:
      tags: [Account]
      operationId: listMySubmissions
      summary: 找回本人的任务草稿、投稿与审核结果
      x-scenarios: [S2, S3]
      x-implementation-status: planned
      security: [{WebSession: []}]
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: 仅本人投稿；包括驳回原因及审核状态
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SubmissionPage'}
        default: {$ref: '#/components/responses/Problem'}

  /api/me/tasks/{taskId}:
    parameters: [{$ref: '#/components/parameters/TaskId'}]
    get:
      tags: [Account]
      operationId: getMyTaskSubmission
      summary: 读取本人任务与初始作品的投稿内容
      x-scenarios: [S2]
      x-implementation-status: planned
      security: [{WebSession: []}]
      responses:
        '200':
          description: 仅任务投稿者可读；其他账号返回 404
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskSubmission'}
        default: {$ref: '#/components/responses/Problem'}
    put:
      tags: [Submissions]
      operationId: replaceTaskDraft
      summary: 修改本人草稿或被驳回的任务
      description: |
        完整替换可编辑内容与初始作品列表，保存为 draft；pending_review、published、taken_down 返回 409。
        expectedRevision 必须等于当前版本，否则 409；保留历史审核记录，不覆盖并发编辑。
      x-scenarios: [S2]
      x-implementation-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TaskDraftUpdate'}
      responses:
        '200':
          description: 保存后的草稿及新版本
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskSubmission'}
        default: {$ref: '#/components/responses/Problem'}

  /api/me/tasks/{taskId}/review-requests:
    parameters: [{$ref: '#/components/parameters/TaskId'}]
    post:
      tags: [Submissions]
      operationId: requestTaskReview
      summary: 将本人任务及双方初始作品一起送审
      description: |
        服务端校验 expectedRevision、完整任务信息及至少一件 human 和一件 agent 作品；缺少任一方返回 422。
        所有材料须可用且授权有效；校验失败时保留草稿，不部分送审。
        同一版本重复请求找回原审核记录；通过后任务及初始作品原子公开。发布不启动云端 agent。
      x-scenarios: [S2]
      x-implementation-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RevisionInput'}
      responses:
        '200':
          description: 送审结果或同一版本已有结果
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskSubmission'}
        '422': {$ref: '#/components/responses/InvalidSubmission'}
        default: {$ref: '#/components/responses/Problem'}

  /api/me/entries/{entryId}:
    parameters: [{$ref: '#/components/parameters/EntryId'}]
    get:
      tags: [Account]
      operationId: getMyEntrySubmission
      summary: 读取本人追加作品与审核结果
      x-scenarios: [S3]
      x-implementation-status: planned
      security: [{WebSession: []}]
      responses:
        '200':
          description: 本人作品投稿；其他账号返回 404
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EntrySubmission'}
        default: {$ref: '#/components/responses/Problem'}
    put:
      tags: [Submissions]
      operationId: resubmitRejectedEntry
      summary: 修改本人被驳回的追加作品并重新送审
      description: |
        仅被驳回且原任务仍公开的独立追加作品可重提；初始作品随任务整体修改。
        校验 expectedRevision，生成新审核记录并保留历史；其他状态或并发冲突返回 409。
        网络重试若携带同一旧版本和完全相同内容，找回该版本产生的重提结果，不再次投稿。
      x-scenarios: [S3]
      x-implementation-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EntryUpdate'}
      responses:
        '200':
          description: 新审核待办对应的作品投稿
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EntrySubmission'}
        default: {$ref: '#/components/responses/Problem'}

  /api/assets:
    post:
      tags: [Submissions]
      operationId: uploadAsset
      summary: 上传作品文件或压缩包
      description: |
        返回的资产初始仅上传者可读；引用资产须校验归属，不因上传自动公开。
        服务端检查实际类型、大小和恶意内容；压缩包按文件保存，不自动解压执行。
        文件白名单、大小上限及保留期在实现前确定；超限 413、不支持类型 415、内容不合法 422。
      x-scenarios: [S2, S3]
      x-implementation-status: planned
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '201':
          description: 已验证且可用于投稿的私有资产
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Asset'}
        default: {$ref: '#/components/responses/Problem'}

  /api/assets/{assetId}:
    parameters:
      - name: assetId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Id'}
    get:
      tags: [Tasks]
      operationId: downloadAsset
      summary: 下载有权阅读的作品文件
      description: |
        匿名和 MCP 仅能访问属于已发布任务、已发布作品且授权公开的文件；未公开文件仅上传者或平台管理员可读。
        下架后立即重新校验权限，不返回长期公开下载 URL。无权访问与不存在均返回 404。
        使用附件下载与 nosniff，不在站点源内执行用户上传的 HTML 或脚本。
      x-scenarios: [S2, S3, S4, S5]
      x-implementation-status: planned
      security: [{}, {WebSession: []}, {McpToken: []}]
      responses:
        '200':
          description: 授权访问的原始文件字节
          headers:
            Content-Disposition:
              description: 附件文件名须经过转义
              schema: {type: string}
            X-Content-Type-Options:
              schema: {type: string, const: nosniff}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        default: {$ref: '#/components/responses/Problem'}

  /api/tasks/{taskId}/voting-eligibility:
    parameters: [{$ref: '#/components/parameters/TaskId'}]
    get:
      tags: [Voting]
      operationId: getVotingEligibility
      summary: 读取当前账号在该题的投票资格
      description: 不含票数，不改变资格；账号从认证取得，不接受 accountId 参数。
      x-scenarios: [S1, S3, S5]
      x-implementation-status: planned
      security: [{WebSession: []}, {McpToken: []}]
      responses:
        '200':
          description: 当前账号在此题的资格
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VotingEligibility'}
        default: {$ref: '#/components/responses/Problem'}

  /api/tasks/{taskId}/comparison:
    parameters: [{$ref: '#/components/parameters/TaskId'}]
    get:
      tags: [Voting]
      operationId: getComparison
      summary: 获取当前账号可比较的人类与 agent 作品对
      description: |
        仅返回该题两件已审核公开作品，一件 human、一件 agent；左右随机，不包含票数或胜率。
        comparisonId 由服务端绑定账号、任务、作品对与左右顺序；读取不提交选票或改变永久资格。
        永久禁投返回 403；没有可投作品对返回 204。具体配对算法与防刷条件待实现时明确。
      x-scenarios: [S1]
      x-implementation-status: planned
      security: [{WebSession: []}]
      responses:
        '200':
          description: 可投的比较对象
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Comparison'}
        '204': {description: 暂无可投作品对}
        '403': {$ref: '#/components/responses/Forbidden'}
        default: {$ref: '#/components/responses/Problem'}

  /api/tasks/{taskId}/votes/{comparisonId}:
    parameters:
      - {$ref: '#/components/parameters/TaskId'}
      - name: comparisonId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Id'}
    put:
      tags: [Voting]
      operationId: castVote
      summary: 提交当前账号对一个作品对的选择
      description: |
        提案采用 left、right、tie；跳过不发送选票。每个账号对同一无序作品对最多一票，改变左右或 comparisonId 不增加票数。
        相同选择重试返回原票，尝试改票返回 409；已永久禁投时即使重放旧票也返回 403。
        校验比较对象确属当前账号与任务、两件作品仍公开且分属双方；返回自己的选票，不返回统计。
        投票提交与 statistics-access 在账号 × 任务上串行化：禁投记录提交后不得新增任何选票。
        若选票先提交，后看统计保留该历史选票；管理员身份不豁免。MCP token 无权投票。
      x-scenarios: [S1, S5]
      x-implementation-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [choice]
              properties:
                choice: {type: string, enum: [left, right, tie]}
      responses:
        '200':
          description: 已保存的本人选票或相同选择的重试结果
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Vote'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        default: {$ref: '#/components/responses/Problem'}

  /api/tasks/{taskId}/statistics-access:
    parameters: [{$ref: '#/components/parameters/TaskId'}]
    post:
      tags: [Voting]
      operationId: accessTaskStatistics
      summary: 永久放弃该题后续投票权并查看统计
      description: |
        客户端必须先披露后果并取得用户明确选择，再发送 permanentlyCloseVoting=true；未确认返回 422，无副作用。
        先验证账号和任务可见性，再持久化账号 × 任务的永久禁投记录，提交成功后才读取并返回统计。
        持久化失败不返回统计；提交成功但响应丢失时禁投记录仍生效，重试不改变首次 closedAt，也不生成选票。
        换 token、作品对或新增作品都不能恢复资格；其他任务及追加作品权限不受影响。
        网站、MCP、榜单下钻和管理员具体反馈查看共用此流程，没有无副作用的 GET 统计旁路。
        Cookie 调用须同时提供 CSRF token；MCP Bearer 调用不使用 Cookie。响应及错误均不可缓存。
      x-scenarios: [S1, S3, S4, S5, S6]
      x-implementation-status: planned
      security:
        - WebSession: []
          CsrfToken: []
        - McpToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [permanentlyCloseVoting]
              properties:
                permanentlyCloseVoting:
                  type: boolean
                  const: true
                  description: 用户已明确选择永久放弃该题后续投票权；不得由预加载代码自动填入
            example: {permanentlyCloseVoting: true}
      responses:
        '200':
