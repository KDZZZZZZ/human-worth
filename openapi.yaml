        重新检查任务公开性、配置、材料授权与可用性、额度；预算和轮数须显式设置，不提供隐含开销默认值。
        任务结论待定仅追加生成；agent 领先可提炼经验；人类领先先准备授权材料并验证投票者，再进入匿名对抗。
        结论由系统计算，客户端不能指定或修改。普通用户、任务作者及 MCP token 均不能启动。
      x-scenarios: [S4]
      x-implementation-status: planned
      security: [{WebSession: [admin], CsrfToken: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [taskId, configuration]
              properties:
                taskId: {$ref: '#/components/schemas/Id'}
                configuration: {$ref: '#/components/schemas/RunConfiguration'}
      responses:
        '202':
          description: 已建立运行记录；可按 ID 轮询，不代表执行成功或作品已过审
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChallengeRun'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        default: {$ref: '#/components/responses/Problem'}

  /api/admin/challenge-runs/{runId}:
    parameters: [{$ref: '#/components/parameters/RunId'}]
    get:
      tags: [Challenges]
      operationId: getChallengeRun
      summary: 查看一次运行的配置、阶段、异常和候选登记状态
      description: 不把生成完成、登记、审核发布或真人反馈混作获胜；不返回额度余额或消耗数值，具体真人统计仍走 statistics-access。
      x-scenarios: [S4, H2]
      x-implementation-status: planned
      security: [{WebSession: [admin]}]
      responses:
        '200':
          description: 完整管理记录；日志摘要不得包含密钥或单题投票统计
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChallengeRun'}
        '403': {$ref: '#/components/responses/Forbidden'}
        default: {$ref: '#/components/responses/Problem'}

  /api/admin/challenge-runs/{runId}/cancel:
    parameters: [{$ref: '#/components/parameters/RunId'}]
    post:
      tags: [Challenges]
      operationId: cancelChallengeRun
      summary: 取消云端运行并拒绝后续结果推进
      description: |
        先提交 cancelled 状态再停止外部调用；与阶段推进、候选登记串行化。
        已取消的重复请求返回原记录；其他终态返回 409。取消或结束后的迟到结果不继续推进、不登记新作品。
        已登记作品保留原审核流程；取消不表示已发生的消耗退回。
      x-scenarios: [S4]
      x-implementation-status: planned
      security: [{WebSession: [admin], CsrfToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReasonInput'}
      responses:
        '200':
          description: 已持久化的取消结果
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChallengeRun'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        default: {$ref: '#/components/responses/Problem'}

  /api/admin/challenge-runs/{runId}/restart:
    parameters: [{$ref: '#/components/parameters/RunId'}]
    post:
      tags: [Challenges]
      operationId: restartChallengeRun
      summary: 从已终止的运行创建关联的新运行
      description: |
        仅 completed、failed、cancelled 可重启；原记录不覆盖，新运行保留同一 taskId 并设置 parentRunId。
        使用显式提供的配置，再次检查任务、授权、材料和额度；不能继承旧运行的通过结果来跳过检查。
      x-scenarios: [S4]
      x-implementation-status: planned
      security: [{WebSession: [admin], CsrfToken: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RunConfiguration'}
      responses:
        '202':
          description: 关联的新运行；相同幂等键找回同一运行
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChallengeRun'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        default: {$ref: '#/components/responses/Problem'}

  /api/admin/challenge-runs/{runId}/candidates/{candidateId}/registration:
    parameters:
      - {$ref: '#/components/parameters/RunId'}
      - name: candidateId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Id'}
    put:
      tags: [Challenges]
      operationId: registerCandidate
      summary: 登记候选作品或找回已有登记与审核状态
      description: |
        仅操作该运行中已持久化的最终候选；不接受客户端上传新的云端结果。
        先按 runId × candidateId 找回已有作品及当前审核状态，不能重置已通过或被驳回作品的状态。
        仅无登记且运行仍 active、材料仍有效时原子创建一件 pending_review 作品及审核记录；并发重试返回同一作品。
        完成运行前应完成候选登记；终态下仅可找回已有登记，无登记返回 409，不补记迟到作品。
      x-scenarios: [S4]
      x-implementation-status: planned
      security: [{WebSession: [admin], CsrfToken: []}]
      responses:
        '200':
          description: 已有作品及当前审核状态
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EntrySubmission'}
        '201':
          description: 首次登记的待审作品
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EntrySubmission'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        default: {$ref: '#/components/responses/Problem'}

  /api/tasks/{taskId}/challenge-progress:
    parameters: [{$ref: '#/components/parameters/TaskId'}]
    get:
      tags: [Challenges]
      operationId: listPublicChallengeProgress
      summary: 分页读取允许公开的云端进度
      description: 仅公开任务及获准披露的运行阶段，不提供私有材料、提示词、预算、日志、未审核作品或具体真人统计。
      x-scenarios: [S4]
      x-implementation-status: planned
      security: [{}, {WebSession: []}, {McpToken: []}]
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: 经过公开字段投影的进度
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProgressPage'}
        default: {$ref: '#/components/responses/Problem'}

  /api/admin/audit-events:
    get:
      tags: [Administration]
      operationId: listAuditEvents
      summary: 分页追溯管理员操作身份与结果
      description: 审核、举报处理、下架、启动、取消、重启和登记均留存；不返回密钥、完整私有材料或单题统计。
      x-scenarios: [S4]
      x-implementation-status: planned
      security: [{WebSession: [admin]}]
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: 不可由客户端修改的操作记录
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditPage'}
        '403': {$ref: '#/components/responses/Forbidden'}
        default: {$ref: '#/components/responses/Problem'}

components:
  securitySchemes:
    WebSession:
      type: apiKey
      in: cookie
      name: __Host-human-worth-session
      description: |
        网站会话，Secure、HttpOnly、SameSite=Lax、Path=/，不设置 Domain。
        服务端验证会话并取得稳定账号；security 中的 admin 表示还须检查平台管理员角色。
        经 Google 回调验证后签发；不接受 Google token 或 Bearer token 替代会话执行网站写入或管理操作。
    GoogleLoginTransaction:
      type: apiKey
      in: cookie
      name: __Host-human-worth-oauth
      description: |
        发起 Google 登录时签发的一次性浏览器流程凭据，最长十分钟；Secure、HttpOnly、SameSite=Lax、Path=/，不设置 Domain。
        只用于回调绑定，必须同时校验 state、nonce 和 PKCE；它不是已登录会话，也不能授权业务操作。
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: 与当前 WebSession 绑定，从 GET /api/me 取得；所有 Cookie 写请求须验证 token 和来源。
    McpToken:
      type: http
      scheme: bearer
      description: |
        用户本人签发用途为 MCP 的内容读取 token，服务端校验有效性、用途与吊销状态。
        仅可读取公开内容及显式访问统计；即使所属账号是管理员，也不可投稿、投票或控制云端。
        token 轮换不改变所属账号；多种凭据同时出现时拒绝请求，避免身份歧义。
  parameters:
    TaskId:
      name: taskId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    EntryId:
      name: entryId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    RunId:
      name: runId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    Cursor:
      name: cursor
      in: query
      description: 服务端返回的不透明游标；首屏省略，后续保持原筛选。无效或过期返回 400。
      schema: {type: string, minLength: 1}
    Limit:
      name: limit
      in: query
      description: 每页上限为 agent 提案；实际返回数量可更少，以 nextCursor 判断后续页。
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        客户端生成的唯一键，按账号和 operation 绑定请求正文及结果，覆盖运行整个保留周期。
        相同键与相同正文返回同一运行；相同键不同正文返回 409，并发请求不能创建多个运行。
        这是本项目的幂等约定，不宣称该 header 已标准化；改变配置再次启动须使用新键。
      schema: {type: string, minLength: 1, maxLength: 128}
  headers:
    NoStore:
      description: 禁止客户端与共享缓存存储响应
      schema: {type: string, const: no-store}
    NoReferrer:
      description: 不把登录回调地址及其敏感 query 作为 Referer 转发
      schema: {type: string, const: no-referrer}
  responses:
    GoogleLoginProblem:
      description: |
        脱敏的登录失败；不返回授权码、state、token、Cookie、Client Secret 或供应方原始错误正文。
        400 invalid_oauth_state / invalid_request；401 invalid_google_login；403 account_disabled；503 login_unavailable。
        终结或失效流程应清除其浏览器 Cookie；确认拒绝时不改变既有网站会话，投票资格始终保留。
        提交结果未知时以服务端持久记录为准，客户端重新发起登录，不重放回调或假定旧会话仍有效。
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        Referrer-Policy: {$ref: '#/components/headers/NoReferrer'}
        Set-Cookie:
          description: 需要清理流程时发送；不清除已有网站会话
          schema: {type: string}
          example: '__Host-human-worth-oauth=; Max-Age=0; Path=/; Secure; HttpOnly; SameSite=Lax'
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Problem:
      description: |
        业务接口统一 application/problem+json；status 与 HTTP 状态相同。
        400 格式或游标错误；401 缺失/失效认证；403 权限、用途、CSRF 或永久投票资格不满足；
        404 不存在或不可见；409 版本、状态或幂等冲突；413 文件过大；415 类型不支持；
        422 内容或确认无效；429 请求过多；503 依赖或持久化不可用。
        所有失败均不得附带单题统计；拒绝请求不得产生未声明的业务副作用。
        此错误格式为 planned 接口约定，当前基础服务的 404/405 仍为空响应体。
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Forbidden:
      description: 身份已识别，但缺少管理员权限、凭据用途不符、CSRF 无效或该题已永久禁投
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: about:blank
            title: Forbidden
            status: 403
            code: voting_permanently_closed
            detail: 此账号已查看该题统计，不能再对该题投票。
    Conflict:
      description: 对象状态、版本、已有选票或幂等键冲突；保留原状态，不重复写入
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    InvalidSubmission:
      description: 请求字段、双方作品、授权或显式确认不满足要求；保持此前状态
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Id:
      type: string
      minLength: 1
      description: 服务端分配的不透明标识，不从中推导账号、时间或权限；作为单个 URL 路径段编码
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 时间，服务端以 UTC 返回
    NullableId:
      type: [string, 'null']
      minLength: 1
    NullableTime:
      type: [string, 'null']
      format: date-time
    NextCursor:
      type: [string, 'null']
      minLength: 1
      description: 为 null 时无后续页；不得编码可还原的具体票数或私有数据
    Health:
      type: object
      additionalProperties: false
      required: [status, service, stage, revision]
      properties:
        status: {type: string, const: ok}
        service: {type: string, const: human-worth}
        stage: {type: string, const: foundation}
        revision: {type: string, description: 已部署 Git SHA；本地开发默认为 development}
    Problem:
      type: object
      required: [type, title, status, code, detail]
      properties:
        type: {type: string, format: uri-reference, default: 'about:blank'}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        code:
          type: string
          description: 稳定的机器错误码；枚举可扩展
          examples: [invalid_request, unauthenticated, forbidden, not_found, revision_conflict, missing_human_or_agent, voting_permanently_closed, run_terminated, idempotency_conflict]
        detail: {type: string, description: 经脱敏的人类可读原因}
        instance: {type: string, format: uri-reference}
    Author:
      type: object
      additionalProperties: false
      required: [id, displayName]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        displayName: {type: string}
    Session:
      type: object
      additionalProperties: false
      required: [account, role, csrfToken]
      properties:
        account: {$ref: '#/components/schemas/Author'}
        role: {type: string, enum: [user, admin]}
        csrfToken: {type: string, minLength: 1}
    PublicationState:
      type: string
      enum: [draft, pending_review, published, rejected, taken_down]
      description: 仅用于任务的发布流程；任务草稿可缺作品。作品使用独立的 EntryReviewState，客户端不可直接设置状态。
    EntryReviewState:
      type: string
      enum: [draft, pending_review, approved, rejected, approval_revoked]
      description: |
        作品只按审核结果决定展示，没有独立公开/私有状态。任务可见且 approved 即允许展示；通过被撤销后为 approval_revoked。
        初始作品可以随任务保存 draft；追加及云端作品创建后进入 pending_review。状态只能由对应的投稿/审核流程改变。
    Conclusion:
      type: string
      enum: [undetermined, human_leading, agent_leading]
      description: 由系统独立依据有效真人反馈计算；算法及阈值待定，不等于发布状态
    Asset:
      type: object
      additionalProperties: false
      required: [id, filename, mediaType, bytes]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        filename: {type: string}
        mediaType: {type: string}
        bytes: {type: integer, minimum: 0}
    Artifact:
      description: 作品交付物；assetId 必须有权使用，外链仅允许 HTTP(S)，不在读取任务时自动抓取或执行。
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, assetId]
          properties:
            kind: {type: string, const: file}
            assetId: {$ref: '#/components/schemas/Id'}
        - type: object
          additionalProperties: false
          required: [kind, url]
          properties:
            kind: {type: string, const: link}
            url: {type: string, format: uri, pattern: '^https?://'}
    Permissions:
      type: object
      additionalProperties: false
      required: [cloudUse]
      properties:
        cloudUse:
          type: boolean
          description: 是否允许该作品用于云端挑战；必须显式选择，无默认授权，启动及重启仍检查有效性
        statement: {type: string, description: 来源权利或云端使用授权的说明，不填写密钥或无关个人信息；不是作品展示开关}
      description: 仅记录用途授权；作品是否允许展示由审核结果决定，不接受 publish/public/private 字段。
    AgentConfiguration:
      type: object
      additionalProperties: false
      required: [model]
      properties:
        model: {type: string, minLength: 1}
        prompt: {type: string, description: 不含密钥的提示词；完整运行配置供投稿审核及获授权的云端使用，不随作品展示响应返回}
        harness: {type: string}
        skills:
          type: array
          items: {type: string}
        parameters:
          type: object
          description: 模型专有非敏感参数；实现按已支持模型验证，不是任意执行指令或密钥容器
          additionalProperties: true
    EntryInput:
      type: object
      additionalProperties: false
      required: [side, title, source, artifacts, permissions]
      properties:
        side: {type: string, enum: [human, agent]}
        title: {type: string, minLength: 1}
        description: {type: string}
        source: {type: string, minLength: 1, description: 作者/模型及作品来源说明，不替代平台账号身份}
        artifacts:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/Artifact'}
        permissions: {$ref: '#/components/schemas/Permissions'}
        agentConfiguration: {$ref: '#/components/schemas/AgentConfiguration'}
      allOf:
        - if:
            properties:
              side: {const: agent}
            required: [side]
          then:
            required: [agentConfiguration]
          else:
            not:
              required: [agentConfiguration]
    TaskDraftInput:
      type: object
      additionalProperties: false
      required: [title, summary, description, entries]
      properties:
        title: {type: string, minLength: 1}
        summary: {type: string}
        description: {type: string}
        category: {type: [string, 'null']}
        entries:
          type: array
          description: 草稿允许空列表或仅一方；送审时服务端要求至少各一件及完整来源、授权和适用配置
          items: {$ref: '#/components/schemas/EntryInput'}
    RevisionInput:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      properties:
        expectedRevision: {type: integer, minimum: 1}
    TaskDraftUpdate:
      type: object
      additionalProperties: false
      required: [expectedRevision, content]
      properties:
        expectedRevision: {type: integer, minimum: 1}
        content: {$ref: '#/components/schemas/TaskDraftInput'}
    EntryUpdate:
      type: object
      additionalProperties: false
      required: [expectedRevision, content]
      properties:
        expectedRevision: {type: integer, minimum: 1}
        content: {$ref: '#/components/schemas/EntryInput'}
    TaskSubmission:
      type: object
      additionalProperties: false
      required: [kind, id, authorId, revision, state, content, reviewId, rejectionReason]
      properties:
        kind: {type: string, const: task}
        id: {$ref: '#/components/schemas/Id'}
        authorId: {$ref: '#/components/schemas/Id'}
        revision: {type: integer, minimum: 1}
        state: {$ref: '#/components/schemas/PublicationState'}
        content: {$ref: '#/components/schemas/TaskDraftInput'}
        reviewId: {$ref: '#/components/schemas/NullableId'}
        rejectionReason: {type: [string, 'null']}
    EntrySubmission:
      type: object
      additionalProperties: false
      required: [kind, id, taskId, authorId, revision, origin, state, content, reviewId, rejectionReason]
      properties:
        kind: {type: string, const: entry}
        id: {$ref: '#/components/schemas/Id'}
        taskId: {$ref: '#/components/schemas/Id'}
        authorId: {$ref: '#/components/schemas/Id'}
        revision: {type: integer, minimum: 1}
        origin: {type: string, enum: [initial, additional, cloud]}
        state: {$ref: '#/components/schemas/EntryReviewState'}
        content: {$ref: '#/components/schemas/EntryInput'}
        reviewId: {$ref: '#/components/schemas/NullableId'}
        rejectionReason: {type: [string, 'null']}
    PublicTask:
      type: object
      additionalProperties: false
      required: [id, title, summary, description, category, author, heat, publishedAt]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        title: {type: string}
        summary: {type: string}
        description: {type: string}
        category: {type: [string, 'null']}
        author: {$ref: '#/components/schemas/Author'}
        heat: {type: number, description: 平台热度排序值；不包含可还原的票数或得票占比}
        publishedAt: {$ref: '#/components/schemas/Timestamp'}
    ApprovedEntry:
      type: object
      additionalProperties: false
      required: [id, taskId, side, title, description, source, artifacts, author, approvedAt]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        taskId: {$ref: '#/components/schemas/Id'}
        side: {type: string, enum: [human, agent]}
        title: {type: string}
        description: {type: string}
        source: {type: string}
        artifacts:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/Artifact'}
        author: {$ref: '#/components/schemas/Author'}
        approvedAt: {$ref: '#/components/schemas/Timestamp'}
      description: 任务可见且作品审核通过时的展示内容；没有公开/私有状态，不返回投稿审核材料、完整运行配置或未过审作品内容。
    VotingEligibility:
      type: object
      additionalProperties: false
      required: [taskId, canVote, permanentlyClosed, closedAt, reason]
      properties:
        taskId: {$ref: '#/components/schemas/Id'}
        canVote: {type: boolean}
        permanentlyClosed: {type: boolean}
        closedAt: {$ref: '#/components/schemas/NullableTime'}
        reason: {type: [string, 'null'], enum: [null, statistics_viewed, other_restriction]}
      allOf:
        - if:
            properties:
              permanentlyClosed: {const: true}
          then:
            properties:
              canVote: {const: false}
              closedAt: {$ref: '#/components/schemas/Timestamp'}
              reason: {const: statistics_viewed}
          else:
            properties:
              closedAt: {type: 'null'}
              reason: {enum: [null, other_restriction]}
        - if:
            properties:
              canVote: {const: true}
          then:
            properties:
              reason: {type: 'null'}
    Ballot:
      type: object
      additionalProperties: false
      required: [id, taskId, catalogRevision, entries, currentVote]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        taskId: {$ref: '#/components/schemas/Id'}
        catalogRevision: {type: integer, minimum: 1}
        entries:
          type: array
          items: {$ref: '#/components/schemas/ApprovedEntry'}
          description: 同一目录版本下该任务全部过审作品；ID 唯一，包含全部 human/agent，无分页、抽样或截断。
        currentVote:
          oneOf:
            - {$ref: '#/components/schemas/Vote'}
            - {type: 'null'}
          description: 仅本人当前选择；尚未投票为 null，不含其他账号的选择或任何计票数据。
      description: 服务端绑定账号、任务、版本及完整候选集合；空 entries 表示没有可选作品，不能提交投票。
    VoteInput:
      type: object
      additionalProperties: false
      required: [ballotId, entryId, expectedVoteRevision]
      properties:
        ballotId: {$ref: '#/components/schemas/Id'}
        entryId: {$ref: '#/components/schemas/Id'}
        expectedVoteRevision: {type: integer, minimum: 0, description: 当前选票的 revision，首次投票为 0}
      description: 只选择一个作品 ID；作品必须仍属于完整且当前有效的候选集合。
    Vote:
      type: object
      additionalProperties: false
      required: [id, taskId, entryId, revision, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        taskId: {$ref: '#/components/schemas/Id'}
        entryId: {$ref: '#/components/schemas/Id'}
        revision: {type: integer, minimum: 1}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        updatedAt: {$ref: '#/components/schemas/Timestamp'}
      description: 当前账号在该任务的一份选择记录；改选增加 revision、不新增票数。不嵌入已撤销过审作品的内容。
    EntryVoteCount:
      type: object
      additionalProperties: false
      required: [entryId, side, votes, voteShare]
      properties:
        entryId: {$ref: '#/components/schemas/Id'}
        side: {type: string, enum: [human, agent]}
        votes: {type: integer, minimum: 0}
        voteShare: {type: [number, 'null'], minimum: 0, maximum: 1}
      description: 仅在显式统计响应中返回；votes / totalVotes，零总票时 voteShare 为 null。
    TaskStatistics:
      type: object
      additionalProperties: false
      required: [taskId, eligibility, totalVotes, humanVotes, agentVotes, humanVoteShare, agentVoteShare, entryVotes, catalogRevision, conclusion, computedAt]
      properties:
        taskId: {$ref: '#/components/schemas/Id'}
        eligibility:
          allOf:
            - {$ref: '#/components/schemas/VotingEligibility'}
            - type: object
              properties:
                permanentlyClosed: {const: true}
        totalVotes: {type: integer, minimum: 0}
        humanVotes: {type: integer, minimum: 0}
        agentVotes: {type: integer, minimum: 0}
        humanVoteShare: {type: [number, 'null'], minimum: 0, maximum: 1}
        agentVoteShare: {type: [number, 'null'], minimum: 0, maximum: 1}
        entryVotes:
          type: array
          items: {$ref: '#/components/schemas/EntryVoteCount'}
        catalogRevision: {type: integer, minimum: 1}
        conclusion: {$ref: '#/components/schemas/Conclusion'}
        computedAt: {$ref: '#/components/schemas/Timestamp'}
      description: |
        技术提案：按账号在该任务的当前选择计票，只统计所选作品仍审核通过且有效的真人选票；撤销通过的作品不进入当前统计，历史选票记录保留。
        entryVotes 覆盖该目录版本下全部过审作品（含零票），每个 entryId 唯一；totalVotes = 所有作品 votes 之和 = humanVotes + agentVotes。
        各作品与两方的得票占比为各自票数 / totalVotes；零总票时占比均为 null。单选没有平票选项，不用两两对抗胜率解释这些占比。
        同一目录与计票快照生成响应；具体防刷有效票规则、领先/翻转算法仍待明确，不预设投票阈值。
        taskId 必须与 eligibility.taskId 相同；统计生成失败可返回 503，但已提交的永久禁投不能回滚。
      allOf:
        - if:
            properties:
              totalVotes: {const: 0}
          then:
            properties:
              humanVotes: {const: 0}
              agentVotes: {const: 0}
              humanVoteShare: {type: 'null'}
              agentVoteShare: {type: 'null'}
          else:
            properties:
              humanVoteShare: {type: number}
              agentVoteShare: {type: number}
    BoardGroup:
      type: object
      additionalProperties: false
      required: [publishedTasks, undeterminedTasks, humanLeadingTasks, agentLeadingTasks]
      properties:
        publishedTasks: {type: integer, minimum: 0}
        undeterminedTasks: {type: integer, minimum: 0}
        humanLeadingTasks: {type: integer, minimum: 0}
        agentLeadingTasks: {type: integer, minimum: 0}
      description: 任务数量总和等于三个结论分组之和；不是单题得票汇总
    Board:
      type: object
      additionalProperties: false
      required: [overall, categories, computedAt]
      properties:
        overall: {$ref: '#/components/schemas/BoardGroup'}
        categories:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [category, summary]
            properties:
              category: {type: [string, 'null']}
              summary: {$ref: '#/components/schemas/BoardGroup'}
        computedAt: {$ref: '#/components/schemas/Timestamp'}
    Comment:
      type: object
      additionalProperties: false
      required: [id, taskId, author, body, createdAt]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        taskId: {$ref: '#/components/schemas/Id'}
        author: {$ref: '#/components/schemas/Author'}
        body: {type: string, minLength: 1}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
    ModerationInput:
      type: object
      additionalProperties: false
      required: [targetKind, targetId, reason]
      properties:
        targetKind: {type: string, enum: [task, entry, comment]}
        targetId: {$ref: '#/components/schemas/Id'}
        reason: {type: string, minLength: 1}
    Report:
      type: object
      additionalProperties: false
      required: [id, target, status, resolutionReason, createdAt, resolvedAt]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        target: {$ref: '#/components/schemas/ModerationInput'}
        status: {type: string, enum: [open, dismissed, actioned]}
        resolutionReason: {type: [string, 'null']}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        resolvedAt: {$ref: '#/components/schemas/NullableTime'}
    ReviewDecision:
      oneOf:
        - type: object
          additionalProperties: false
          required: [decision]
          properties:
            decision: {type: string, const: approve}
            reason: {type: string}
        - type: object
          additionalProperties: false
          required: [decision, reason]
          properties:
            decision: {type: string, const: reject}
            reason: {type: string, minLength: 1}
    Review:
      type: object
      additionalProperties: false
      required: [id, submission, status, reason, reviewerId, createdAt, decidedAt]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        submission:
          description: 本次送审时的不可变快照；其中 revision 标识被审核的版本，当前审核结果以下方 status 为准
          oneOf:
            - {$ref: '#/components/schemas/TaskSubmission'}
            - {$ref: '#/components/schemas/EntrySubmission'}
        status: {type: string, enum: [pending, approved, rejected]}
        reason: {type: [string, 'null']}
        reviewerId: {$ref: '#/components/schemas/NullableId'}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        decidedAt: {$ref: '#/components/schemas/NullableTime'}
    Quantity:
      type: object
      additionalProperties: false
      required: [amount, unit]
      properties:
        amount: {type: number, minimum: 0}
        unit: {type: string, minLength: 1, description: 平台已配置的额度单位；不同 unit 不可相加}
    AdminDashboard:
      type: object
      additionalProperties: false
      required: [pendingTaskReviews, pendingEntryReviews, openReports, activeRuns, failedRuns]
      properties:
        pendingTaskReviews: {type: integer, minimum: 0}
        pendingEntryReviews: {type: integer, minimum: 0}
        openReports: {type: integer, minimum: 0}
        activeRuns: {type: integer, minimum: 0}
        failedRuns: {type: integer, minimum: 0}
    RunConfiguration:
      type: object
      additionalProperties: false
      required: [generator, voter, roundLimit, budget]
      properties:
        generator: {$ref: '#/components/schemas/AgentConfiguration'}
        voter: {$ref: '#/components/schemas/AgentConfiguration'}
        roundLimit: {type: integer, minimum: 1}
        budget:
          allOf:
            - {$ref: '#/components/schemas/Quantity'}
            - type: object
              properties:
                amount: {exclusiveMinimum: 0}
      description: 配置是运行创建时快照；修改配置通过新运行完成，不原地改变已启动运行
    RunStatus:
      type: string
      enum: [queued, active, completed, failed, cancelled]
      description: completed、failed、cancelled 为终态，之后不接纳迟到结果或新登记
    RunStage:
      type: string
      enum: [queued, preparing_materials, validating_voter, generating, learning, anonymous_battle, registering, finished]
      description: 阶段枚举为提案，仍须遵守待定/agent 领先/人类领先的分流及材料校验顺序
    ChallengeRun:
      type: object
      additionalProperties: false
      required: [id, taskId, parentRunId, administratorId, status, stage, round, taskConclusion, configuration, failureReason, candidates, createdAt, updatedAt, endedAt]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        taskId: {$ref: '#/components/schemas/Id'}
        parentRunId: {$ref: '#/components/schemas/NullableId'}
        administratorId: {$ref: '#/components/schemas/Id'}
        status: {$ref: '#/components/schemas/RunStatus'}
        stage: {$ref: '#/components/schemas/RunStage'}
        round: {type: integer, minimum: 0}
        taskConclusion: {$ref: '#/components/schemas/Conclusion'}
        configuration: {$ref: '#/components/schemas/RunConfiguration'}
        failureReason: {type: [string, 'null'], description: 经脱敏的模型、运行限制或材料失效原因，不夹带额度余额、消耗数值或单题票数}
        candidates:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, registrationState, entryId, reviewId]
            properties:
              id: {$ref: '#/components/schemas/Id'}
              registrationState: {type: string, enum: [unregistered, registered, discarded]}
              entryId: {$ref: '#/components/schemas/NullableId'}
              reviewId: {$ref: '#/components/schemas/NullableId'}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        updatedAt: {$ref: '#/components/schemas/Timestamp'}
        endedAt: {$ref: '#/components/schemas/NullableTime'}
    PublicProgress:
      type: object
      additionalProperties: false
      required: [runId, status, stage, round, updatedAt]
      properties:
        runId: {$ref: '#/components/schemas/Id'}
        status: {$ref: '#/components/schemas/RunStatus'}
        stage: {$ref: '#/components/schemas/RunStage'}
        round: {type: integer, minimum: 0}
        updatedAt: {$ref: '#/components/schemas/Timestamp'}
    ReasonInput:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, minLength: 1}
    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, actorId, action, targetId, outcome, reason, createdAt]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        actorId: {$ref: '#/components/schemas/Id'}
        action: {type: string}
        targetId: {$ref: '#/components/schemas/Id'}
        outcome: {type: string, enum: [succeeded, rejected, failed]}
        reason: {type: [string, 'null']}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
    TaskPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/PublicTask'}}
        nextCursor: {$ref: '#/components/schemas/NextCursor'}
    EntryPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ApprovedEntry'}}
        nextCursor: {$ref: '#/components/schemas/NextCursor'}
    SubmissionPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            oneOf:
              - {$ref: '#/components/schemas/TaskSubmission'}
              - {$ref: '#/components/schemas/EntrySubmission'}
        nextCursor: {$ref: '#/components/schemas/NextCursor'}
    CommentPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Comment'}}
        nextCursor: {$ref: '#/components/schemas/NextCursor'}
    ReviewPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Review'}}
        nextCursor: {$ref: '#/components/schemas/NextCursor'}
    ReportPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Report'}}
        nextCursor: {$ref: '#/components/schemas/NextCursor'}
    RunPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ChallengeRun'}}
        nextCursor: {$ref: '#/components/schemas/NextCursor'}
    ProgressPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/PublicProgress'}}
        nextCursor: {$ref: '#/components/schemas/NextCursor'}
    AuditPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AuditEvent'}}
        nextCursor: {$ref: '#/components/schemas/NextCursor'}
