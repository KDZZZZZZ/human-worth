      description: 不含票数，不改变资格；账号从认证取得，不接受 accountId 参数。
      x-scenarios: [S1, S3, S5]
      x-implementation-status: planned
      security: [{WebSession: []}, {McpToken: []}]
      responses:
        '200':
          description: 当前账号在此题的资格
