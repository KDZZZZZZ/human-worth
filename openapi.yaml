openapi: 3.1.1
info:
  title: Human Worth API
  version: 0.4.0-draft
  summary: 人类价值平台的 HTTP 接口契约草案
  description: |
    行为依据为 docs/prd.md 中的可信场景 S1～S6、2026-09-18 人类修订 H1～H3，以及 AGENTS.md 的发帖、评论、投票目标。
    当前仅 /api/health 的 GET、HEAD 已实现；其余 operation 均为 planned，不能据此认定线上可调用。
    路径、字段、状态枚举、认证载体和分页等具体选择属于 Agent Self-Claimed，详见 docs/references.md。

    作品以审核结果决定展示，没有独立的公开/私有或公开授权开关；云端使用授权另行检查。
    投票一次给出该任务全部允许展示的过审作品，用户从中单选一件最认可的作品。
    管理概览与运行记录不展示剩余额度、已用额度或消耗数值；启动/重启的预算配置及后台执行限制继续保留。
    普通 GET 不改变投票资格，不返回或预取单题得票、得票占比；投票响应也不附带统计。
    只有显式 POST statistics-access 可以读取具体统计，且必须先持久化账号 × 任务的永久禁投记录。
    网站、MCP 和管理员查看单题具体统计均经过此入口；管理角色不能绕过资格变化。
    所有业务响应使用 Cache-Control: no-store；错误响应也不得泄露统计、密钥或私有内容。

    网站使用会话及 CSRF token；MCP token 仅用于公开内容读取和显式统计访问，不接受于投稿、投票或管理接口。
    账号和管理员身份由服务端认证取得，不接受客户端指定账号或角色。两种凭据必须映射到同一稳定账号 ID。
    Google 登录使用服务端授权码流程（OIDC + PKCE S256），成功后建立网站会话；GET /api/me 查询本人身份。
    登录入口和回调不要求已有网站会话，过期网站会话不阻止重新登录；它们拒绝 Bearer token，回调必须验证独立的登录流程 Cookie 与 state。
    其他公开业务操作允许不带凭据；携带无效凭据时返回 401，不退回匿名访问；同时携带会话与 Bearer 时返回 400。
    业务接口启用前须接入 HTTPS；现有公网 HTTP 仅用于建设中页面和健康检查。
    Google 正式回调须使用预先注册的 HTTPS 域名，不能使用现有公网 IP 地址；Client Secret 仅保存在服务端。
    首次有效 Google 登录创建普通账号，再次登录复用稳定账号；不按邮箱自动合并账号或授予管理员。
    MCP token 签发/吊销、管理员授予、具体算法、文件限额及云端内部通信仍待实现阶段补全。
externalDocs:
  description: 产品需求与可信场景
  url: https://github.com/KDZZZZZZ/human-worth/blob/dev/docs/prd.md
servers:
  - url: /
    description: 同源部署；planned 接口尚不可调用，带凭据的业务请求必须使用 HTTPS
security:
  - WebSession: []
    CsrfToken: []
x-contract-authority: Agent Self-Claimed
x-mcp:
  description: |
    以下仅为本地 MCP 工具到 HTTP 操作的映射提案，不是 MCP 的 JSON-RPC 或传输协议定义。
    仅暴露下列三个工具；不要从本文件自动暴露全部 operation。
    工具注解是提示，服务端仍须执行账号、用途和权限检查。
  tools:
    list_tasks:
      operationId: listTasks
      readOnlyHint: true
    get_task:
      operationId: getTask
      readOnlyHint: true
      description: 仅公开任务内容；作品可通过公开读取接口加载，禁止隐式拉取统计。
    view_task_statistics:
      operationId: accessTaskStatistics
      readOnlyHint: false
      destructiveHint: true
      description: 客户端须先说明永久失去该题投票权，再以明确确认为参数调用；不提交选票。
tags:
  - {name: Health, description: 已实现的基础服务}
  - {name: Authentication, description: Google 登录、回调和退出网站会话；当前均待实现}
  - {name: Account, description: 当前会话和本人投稿}
  - {name: Tasks, description: 推荐发现、任务与过审作品}
  - {name: Submissions, description: 草稿、上传与审核申请}
  - {name: Voting, description: 全部作品单选与永久投票资格}
  - {name: Board, description: 公开看板与热度排行}
  - {name: Discussion, description: 评论及举报}
  - {name: Administration, description: 管理员审核、下架与审计}
  - {name: Challenges, description: 管理员云端挑战与公开进度}
paths:
  /api/health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: 获取基础服务健康状态
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: 当前进程可响应；不代表产品业务或云端挑战已实现
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
              example: {status: ok, service: human-worth, stage: foundation, revision: development}
    head:
      tags: [Health]
      operationId: headHealth
      summary: 检查基础服务是否可响应
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: 与 GET 相同的状态及响应头，无响应体
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            Content-Type:
              schema: {type: string, const: 'application/json; charset=utf-8'}

  /api/auth/google:
    get:
      tags: [Authentication]
      operationId: startGoogleLogin
      summary: 发起 Google 登录
      description: |
        浏览器以顶层页面导航打开本接口，接收 302 后进入 Google；不要用 fetch 跟随跨站登录跳转。
        服务端创建十分钟有效、绑定浏览器的一次性登录流程，保存随机 state、nonce 和 PKCE verifier，发送 S256 challenge。
        仅请求 openid、email、profile，使用 response_type=code；不请求离线访问或其他 Google API 权限。
        同一浏览器重新发起会使前一次未完成流程失效；既有网站会话暂不改变。
        Google redirect_uri 来自服务端的环境配置并与注册值完全一致，不接受客户端提供 redirect_uri、returnTo、角色或账号 ID。
        已有网站会话即使过期也可重新登录；携带 Authorization/Bearer 返回 400，MCP 不暴露此入口。
        Client Secret 和 PKCE verifier 不进入浏览器、URL 或日志；具体回调配置未就绪时返回 503，不降级到公网 HTTP/IP 回调。
      x-scenarios: [H3]
      x-implementation-status: planned
      security: []
      responses:
        '302':
          description: 创建登录流程并跳转至 Google；尚未登录 Human Worth
          headers:
            Location:
              description: 服务端构造的 Google 授权地址，含客户端 ID、固定回调、最小 scopes、state、nonce 和 S256 challenge
              schema: {type: string, format: uri}
            Set-Cookie:
              description: 随机登录流程凭据；十分钟有效，HttpOnly、Secure、SameSite=Lax、Path=/，不设置 Domain
              schema: {type: string}
              example: '__Host-human-worth-oauth=opaque-login-handle; Max-Age=600; Path=/; Secure; HttpOnly; SameSite=Lax'
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            Referrer-Policy: {$ref: '#/components/headers/NoReferrer'}
        '400': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}

  /api/auth/google/callback:
    get:
      tags: [Authentication]
      operationId: completeGoogleLogin
      summary: 接收 Google 回调并建立网站会话
      description: |
        由 Google 导航回调，不是前端手工提交 Google ID token 的接口。无需已有网站会话，但必须携带发起登录时的流程 Cookie。
        state 必填且只能出现一次；code 与 error 必须二选一且只出现一次，重复参数或缺失/冲突返回 400。
        忽略 Google 附带的其他响应参数，不用其决定身份、角色或跳转地址。
        Identity 先验证流程 Cookie、state 与有效期，再原子占用一次性流程；多副本并发回调只允许一份继续，重放返回 400。
        服务端使用授权码、固定 redirect_uri、Client Secret 和原 PKCE verifier 换取 token；验证 ID token 签名、发行方、受众、有效期、nonce，以及适用的 azp。
        只接受 Google 发行方的允许值，规范为 https://accounts.google.com 后按 (issuer, sub) 关联稳定账号；邮箱、显示名和回调参数不能替代 sub。
        首次登录原子创建普通账号，重复登录复用账号；不按相同邮箱自动绑定其他账号，不重建投票资格，不自动授予管理员。
        成功时使当前浏览器的旧网站会话失效并签发新会话，清除流程 Cookie，303 回到 /；前端随后调用 GET /api/me 取得账号和 CSRF token。
        用户拒绝授权且流程验证通过时，清除流程 Cookie 并 303 回到 /?login=cancelled，保留原有网站会话。
        验证失败不建立新会话：无效/过期/重放流程返回 400；授权码或 ID token 无效返回 401；账号禁用返回 403；供应方或存储暂不可用返回 503。
        流程占用后失败或结果未知须重新发起登录，不盲目重放授权码。已成功提交但响应丢失的会话轮换仍以持久记录为准；错误不改变其他账号或既有投票记录。
        所有回调响应（包括错误）均 no-store、no-referrer；访问日志须屏蔽回调 query、Cookie、授权码和 token。
        Google access/ID/refresh token 不返回前端、不作为网站或 MCP 凭据，不写 localStorage；携带 Bearer 返回 400。
      x-scenarios: [H3]
      x-implementation-status: planned
      security: [{GoogleLoginTransaction: []}]
      parameters:
        - name: state
          in: query
          required: true
          description: 发起流程时服务端生成的随机值，必须与该浏览器的一次性流程匹配
          schema: {type: string, minLength: 1, maxLength: 1024}
        - name: code
          in: query
          description: Google 返回的一次性授权码；与 error 恰有一个，不接受前端自行提供账号资料
          schema: {type: string, minLength: 1, maxLength: 4096}
        - name: error
          in: query
          description: Google 返回的授权错误；access_denied 表示用户拒绝，其余错误按脱敏后的错误响应处理
          schema: {type: string, minLength: 1, maxLength: 128}
          example: access_denied
      responses:
        '303':
          description: 登录成功返回 /；用户拒绝授权返回 /?login=cancelled。具体账号通过 GET /api/me 查询
          headers:
            Location:
              schema: {type: string, enum: ['/', '/?login=cancelled']}
            Set-Cookie:
              description: |
                成功时设置新网站会话，并以第二条独立 Set-Cookie 清除 __Host-human-worth-oauth（空值、Max-Age=0、Path=/、Secure、HttpOnly、SameSite=Lax）。
                用户拒绝时只清除流程 Cookie。重复的 Set-Cookie 必须分别发送，不能用逗号合并；下例仅展示成功时的网站会话字段。
              schema: {type: string}
              example: '__Host-human-worth-session=opaque-session; Path=/; Secure; HttpOnly; SameSite=Lax'
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            Referrer-Policy: {$ref: '#/components/headers/NoReferrer'}
        '400': {$ref: '#/components/responses/GoogleLoginProblem'}
        '401': {$ref: '#/components/responses/GoogleLoginProblem'}
        '403': {$ref: '#/components/responses/GoogleLoginProblem'}
        '503': {$ref: '#/components/responses/GoogleLoginProblem'}
        default: {$ref: '#/components/responses/GoogleLoginProblem'}

  /api/auth/logout:
    post:
      tags: [Authentication]
      operationId: logoutCurrentSession
      summary: 退出当前网站会话
      description: |
        验证当前会话、X-CSRF-Token 与来源后，服务端撤销该会话并清除浏览器会话 Cookie。
        不退出其他设备、不撤销 MCP token、不退出 Google 账号、不删除平台账号或恢复任何任务的投票资格。
        已失效会话返回 401；不以只清除 Cookie 代替服务端撤销，不能通过 GET 触发退出。
      x-scenarios: [H3]
      x-implementation-status: planned
      security: [{WebSession: [], CsrfToken: []}]
      responses:
        '204':
          description: 当前会话已在服务端撤销，无响应体
          headers:
            Set-Cookie:
              schema: {type: string}
              example: '__Host-human-worth-session=; Max-Age=0; Path=/; Secure; HttpOnly; SameSite=Lax'
            Cache-Control: {$ref: '#/components/headers/NoStore'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}

  /api/me:
    get:
      tags: [Account]
      operationId: getCurrentSession
      summary: 获取当前网站账号与 CSRF token
      x-scenarios: [S2, S3, S4, S5, H3]
      x-implementation-status: planned
      security: [{WebSession: []}]
      responses:
        '200':
          description: Google 登录成功后查询本人身份；csrfToken 仅用于当前网站会话的写请求，不返回 Google token
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        default: {$ref: '#/components/responses/Problem'}

  /api/tasks:
    get:
      tags: [Tasks]
      operationId: listTasks
      summary: 分页浏览公开任务
      description: |
        首页默认 recommended；看板排行榜使用 hot，按热度降序排列，同热度按任务 ID 升序。
        游标绑定排序、筛选及列表快照，持续滚动不重复同一任务；快照内已下架内容即时过滤。
        不返回具体得票或得票占比，不因读取改变资格。heat 是不可反推出具体票数的排序分值。
        q 仅检索允许公开的任务文本，不检索私有投稿或统计。
      x-scenarios: [S1, S5, S6]
      x-implementation-status: planned
      security: [{}, {WebSession: []}, {McpToken: []}]
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - name: order
          in: query
          schema: {type: string, enum: [recommended, hot], default: recommended}
        - name: category
          in: query
          schema: {type: string, minLength: 1}
        - name: q
          in: query
          schema: {type: string, minLength: 1}
      responses:
        '200':
          description: 已审核发布任务；nextCursor 为 null 时没有后续页
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskPage'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Submissions]
      operationId: createTaskDraft
      summary: 保存新任务草稿
      description: 可缺少一方或双方作品，不进入公开查询或审核，不启动云端挑战。
      x-scenarios: [S2]
      x-implementation-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TaskDraftInput'}
      responses:
        '201':
          description: 本人草稿已保存
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskSubmission'}
        default: {$ref: '#/components/responses/Problem'}

  /api/tasks/{taskId}:
    parameters: [{$ref: '#/components/parameters/TaskId'}]
    get:
      tags: [Tasks]
      operationId: getTask
      summary: 阅读公开任务详情
      description: 只返回已发布任务；草稿、待审、驳回和下架内容返回 404。普通作品浏览可分页；投票通过 ballot 一次取得全部过审作品，不隐式读取统计。
      x-scenarios: [S1, S3, S5, S6]
      x-implementation-status: planned
      security: [{}, {WebSession: []}, {McpToken: []}]
      responses:
        '200':
          description: 公开任务正文，不含票数和得票占比
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicTask'}
        default: {$ref: '#/components/responses/Problem'}

  /api/tasks/{taskId}/entries:
    parameters: [{$ref: '#/components/parameters/TaskId'}]
    get:
      tags: [Tasks]
      operationId: listApprovedEntries
      summary: 分页浏览该题通过审核的作品
      description: |
        任务须可见，作品须为 approved；没有作品公开/私有状态，也不检查单独的公开授权。
        此分页接口用于普通浏览；投票页面必须使用 ballot 一次取得全部过审作品，不得仅以某一页作为候选集合。
        不暴露其他人的草稿、待审作品、内部配置或单题统计。
      x-scenarios: [S1, S3, S5, H1]
      x-implementation-status: planned
      security: [{}, {WebSession: []}, {McpToken: []}]
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: 审核通过、允许展示的作品
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EntryPage'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Submissions]
      operationId: submitAdditionalEntry
      summary: 向任意公开任务追加一件作品并送审
      description: |
        任意网站用户可单方追加，不要求作者邀请或批准；即使已永久失去该题投票权也可投稿。
        仅新作品进入 pending_review，原任务保持 published。作品署名不能决定投稿者账号。
        校验资产归属、来源、授权及适用配置；不恢复投票资格，不启动云端挑战。
      x-scenarios: [S3]
      x-implementation-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EntryInput'}
      responses:
        '201':
          description: 新作品与独立审核记录已建立
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EntrySubmission'}
        default: {$ref: '#/components/responses/Problem'}

  /api/me/submissions:
    get:
      tags: [Account]
      operationId: listMySubmissions
      summary: 找回本人的任务草稿、投稿与审核结果
      x-scenarios: [S2, S3]
      x-implementation-status: planned
      security: [{WebSession: []}]
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: 仅本人投稿；包括驳回原因及审核状态
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SubmissionPage'}
        default: {$ref: '#/components/responses/Problem'}

  /api/me/tasks/{taskId}:
    parameters: [{$ref: '#/components/parameters/TaskId'}]
    get:
      tags: [Account]
      operationId: getMyTaskSubmission
      summary: 读取本人任务与初始作品的投稿内容
      x-scenarios: [S2]
      x-implementation-status: planned
      security: [{WebSession: []}]
      responses:
        '200':
          description: 仅任务投稿者可读；其他账号返回 404
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskSubmission'}
        default: {$ref: '#/components/responses/Problem'}
    put:
      tags: [Submissions]
      operationId: replaceTaskDraft
      summary: 修改本人草稿或被驳回的任务
      description: |
        完整替换可编辑内容与初始作品列表，保存为 draft；pending_review、published、taken_down 返回 409。
        expectedRevision 必须等于当前版本，否则 409；保留历史审核记录，不覆盖并发编辑。
      x-scenarios: [S2]
      x-implementation-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TaskDraftUpdate'}
      responses:
        '200':
          description: 保存后的草稿及新版本
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskSubmission'}
        default: {$ref: '#/components/responses/Problem'}

  /api/me/tasks/{taskId}/review-requests:
    parameters: [{$ref: '#/components/parameters/TaskId'}]
    post:
      tags: [Submissions]
      operationId: requestTaskReview
      summary: 将本人任务及双方初始作品一起送审
      description: |
        服务端校验 expectedRevision、完整任务信息及至少一件 human 和一件 agent 作品；缺少任一方返回 422。
        所有材料须可用且授权有效；校验失败时保留草稿，不部分送审。
        同一版本重复请求找回原审核记录；通过后任务发布、初始作品获准展示，在同一事务生效。发布不启动云端 agent。
      x-scenarios: [S2]
      x-implementation-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RevisionInput'}
      responses:
        '200':
          description: 送审结果或同一版本已有结果
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskSubmission'}
        '422': {$ref: '#/components/responses/InvalidSubmission'}
        default: {$ref: '#/components/responses/Problem'}

  /api/me/entries/{entryId}:
    parameters: [{$ref: '#/components/parameters/EntryId'}]
    get:
      tags: [Account]
      operationId: getMyEntrySubmission
      summary: 读取本人追加作品与审核结果
      x-scenarios: [S3]
      x-implementation-status: planned
      security: [{WebSession: []}]
      responses:
        '200':
          description: 本人作品投稿；其他账号返回 404
