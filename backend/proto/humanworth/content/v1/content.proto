syntax = "proto3";

package humanworth.content.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "humanworth/asset/v1/asset.proto";

option go_package = "github.com/KDZZZZZZ/human-worth/backend/gen/humanworth/content/v1;contentv1";

// Website draft RPCs are implemented; Challenge collaboration RPCs remain dependency contracts.
service ContentService {
  // Voting mTLS only; complete allowlisted snapshot, never browsing pagination.
  rpc GetVotingCatalogSnapshot(GetVotingCatalogSnapshotRequest) returns (GetVotingCatalogSnapshotResponse);
  rpc ListComments(ListCommentsRequest) returns (ListCommentsResponse);
  rpc CreateComment(CreateCommentRequest) returns (CreateCommentResponse);
  // Discovery-only safe projection, no vote counts or private metadata.
  rpc ListDiscoverableTasks(ListDiscoverableTasksRequest) returns (ListDiscoverableTasksResponse);
  // Moderation-only authority; a report does not change visibility.
  rpc CheckModerationTarget(CheckModerationTargetRequest) returns (CheckModerationTargetResponse);
  rpc ApplyTakedown(ApplyTakedownRequest) returns (ApplyTakedownResponse);
  // Voting-only complete approved catalog.
  rpc GetVotingCatalog(GetVotingCatalogRequest) returns (GetVotingCatalogResponse);
  // Gateway mTLS + method-bound Identity assertion (anonymous/web/MCP); 2s.
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
  // Read-only browsing, NOT the complete Voting ballot; 5s, keyset pagination.
  rpc ListApprovedEntries(ListApprovedEntriesRequest) returns (ListApprovedEntriesResponse);
  // Web-only additional work; durable local acceptance, not remote case acknowledgement.
  // Create idempotency: owner + task + key; normalized content SHA-256. 5s.
  rpc SubmitAdditionalEntry(SubmitAdditionalEntryRequest) returns (SubmitAdditionalEntryResponse);
  rpc GetMyEntrySubmission(GetMyEntrySubmissionRequest) returns (GetMyEntrySubmissionResponse);
  // Rejected only; expected_revision identifies the immutable retry result. 5s.
  rpc ResubmitRejectedEntry(ResubmitRejectedEntryRequest) returns (ResubmitRejectedEntryResponse);
  // Web-only; default all additional-entry states, never initial/cloud. 5s.
  rpc ListMyEntrySubmissions(ListMyEntrySubmissionsRequest) returns (ListMyEntrySubmissionsResponse);
  // Moderation mTLS only. No user assertion or Asset callback.
  rpc GetEntryReviewSnapshot(GetEntryReviewSnapshotRequest) returns (GetEntryReviewSnapshotResponse);
  // Exact decision + snapshot digest; persistent receipt; safe identical retry, 5s.
  rpc ApplyEntryReviewDecision(ApplyEntryReviewDecisionRequest) returns (ApplyEntryReviewDecisionResponse);
  rpc CreateTaskDraft(CreateTaskDraftRequest) returns (CreateTaskDraftResponse);
  rpc GetMyTaskSubmission(GetMyTaskSubmissionRequest) returns (GetMyTaskSubmissionResponse);
  rpc ListMySubmissions(ListMySubmissionsRequest) returns (ListMySubmissionsResponse);
  rpc ReplaceTaskDraft(ReplaceTaskDraftRequest) returns (ReplaceTaskDraftResponse);
  // Gateway web session, CSRF; natural task/revision idempotency; 5s.
  rpc RequestTaskReview(RequestTaskReviewRequest) returns (RequestTaskReviewResponse);
  // Moderation mTLS only; no user assertion; immutable submitted snapshot.
  rpc GetReviewSnapshot(GetReviewSnapshotRequest) returns (GetReviewSnapshotResponse);
  // Moderation mTLS only; exact decision retry returns persisted receipt; 5s.
  rpc ApplyReviewDecision(ApplyReviewDecisionRequest) returns (ApplyReviewDecisionResponse);
  // Asset mTLS only, administrator assertion bound to this method; no callback.
  rpc CheckReviewAssetAccess(CheckReviewAssetAccessRequest) returns (CheckReviewAssetAccessResponse);

  // Public file access is checked only by Asset; no callback to Asset here.
  rpc CheckAssetAccess(CheckAssetAccessRequest) returns (CheckAssetAccessResponse);
  // Trusted Moderation decision application, NOT an admin/browser approval API.
  rpc ApplyAssetReview(ApplyAssetReviewRequest) returns (ApplyAssetReviewResponse);

  // Challenge dependencies: implemented by stateful integration fixtures until the full modules land.
  rpc GetChallengeTaskDescription(GetChallengeTaskDescriptionRequest) returns (GetChallengeTaskDescriptionResponse);
  rpc ListChallengeWorks(ListChallengeWorksRequest) returns (ListChallengeWorksResponse);
  rpc ListChallengeComments(ListChallengeCommentsRequest) returns (ListChallengeCommentsResponse);
  rpc CheckChallengeMaterials(CheckChallengeMaterialsRequest) returns (CheckChallengeMaterialsResponse);
  rpc OpenRunRegistration(OpenRunRegistrationRequest) returns (OpenRunRegistrationResponse);
  rpc CloseRunRegistration(CloseRunRegistrationRequest) returns (CloseRunRegistrationResponse);
  rpc RegisterChallengeCandidate(RegisterChallengeCandidateRequest) returns (RegisterChallengeCandidateResponse);
  rpc GetChallengeRegistration(GetChallengeRegistrationRequest) returns (GetChallengeRegistrationResponse);
}

// Explicit public projections: no review metadata, permissions or model config.
// Missing legacy timestamps/display names are absent, never synthesized.
message PublicAuthor {
  string id = 1;
  optional string display_name = 2;
}
message PublicTask {
  string id = 1;
  int64 revision = 2;
  string title = 3;
  string summary = 4;
  string description = 5;
  optional string category = 6;
  PublicAuthor author = 7;
  optional double heat = 8;
  google.protobuf.Timestamp published_at = 9;
  // Explicit task-level files; never inferred from an entry.
  repeated humanworth.asset.v1.Asset task_attachments = 10;
}
message ApprovedEntry {
  string id = 1;
  string task_id = 2;
  string side = 3;
  string title = 4;
  string description = 5;
  string source = 6;
  repeated ArtifactInput artifacts = 7;
  PublicAuthor author = 8;
  google.protobuf.Timestamp approved_at = 9;
}
message GetTaskRequest {
  string actor_assertion = 1;
  string task_id = 2;
}
message GetTaskResponse {
  PublicTask task = 1;
}
message ListApprovedEntriesRequest {
  string actor_assertion = 1;
  string task_id = 2;
  int32 limit = 3;
  string cursor = 4;
}
message ListApprovedEntriesResponse {
  repeated ApprovedEntry items = 1;
  string next_cursor = 2;
}

message ArtifactInput {
  string kind = 1;
  optional string asset_id = 2;
  optional string url = 3;
  optional string text = 4;
}
message PermissionsInput {
  optional bool cloud_use = 1;
  optional string statement = 2;
}
message AgentConfigurationInput {
  string model = 1;
  optional string prompt = 2;
  optional string harness = 3;
  repeated string skills = 4;
  // Stored draft metadata only; never fetched, interpreted or executed.
  google.protobuf.Struct parameters = 5;
}
message EntryInput {
  // Exactly human or agent, matching OpenAPI.
  string side = 1;
  string title = 2;
  optional string description = 3;
  string source = 4;
  repeated ArtifactInput artifacts = 5;
  PermissionsInput permissions = 6;
  AgentConfigurationInput agent_configuration = 7;
}
message TaskDraftInput {
  string title = 1;
  optional string summary = 2;
  optional string description = 3;
  optional string category = 4;
  // Initial drafts are ordered components of this aggregate, not public entries.
  repeated EntryInput entries = 5;
  repeated TaskAttachmentInput task_attachments = 6;
}
message TaskSubmission {
  string id = 1;
  // Always derived from VerifyActor; not accepted in any input.
  string author_id = 2;
  int64 revision = 3;
  // Authoritative publication state; not a client-controlled visibility flag.
  string state = 4;
  TaskDraftInput content = 5;
  optional string review_id = 6;
  optional string rejection_reason = 7;
}
message CreateTaskDraftRequest {
  string actor_assertion = 1;
  string idempotency_key = 2;
  TaskDraftInput content = 3;
  // Gateway obtains this assertion for the same web session and Asset method.
  string asset_actor_assertion = 4;
}
message CreateTaskDraftResponse {
  TaskSubmission submission = 1;
}
message GetMyTaskSubmissionRequest {
  string actor_assertion = 1;
  string task_id = 2;
}
message GetMyTaskSubmissionResponse {
  TaskSubmission submission = 1;
}
message ListMySubmissionsRequest {
  string actor_assertion = 1;
  // Empty values select the only implemented first-phase values.
  string kind = 2;
  string state = 3;
  optional string category = 4;
  int32 limit = 5;
  string cursor = 6;
}
message ListMySubmissionsResponse {
  repeated TaskSubmission items = 1;
  string next_cursor = 2;
}
message ReplaceTaskDraftRequest {
  string actor_assertion = 1;
  string task_id = 2;
  int64 expected_revision = 3;
  TaskDraftInput content = 4;
  string asset_actor_assertion = 5;
}
message ReplaceTaskDraftResponse {
  TaskSubmission submission = 1;
}

// Artifact 是作品正文或文件，链接只能作为补充；不携带作者与模型身份。
message Artifact {
  oneof value {
    string text = 1;
    humanworth.asset.v1.Asset file = 2;
    string link = 3;
  }
}
message Work {
  string id = 1;
  repeated Artifact artifacts = 2;
}
message TaskAttachment {
  humanworth.asset.v1.Asset asset = 1;
  bool cloud_use_allowed = 2;
}
message TaskDescription {
  string task_id = 1;
  int64 revision = 2;
  string description = 3;
  repeated TaskAttachment attachments = 4;
}
message Comment {
  string id = 1;
  string body = 2;
}
// SnapshotRef 固定任务、作品目录及评论截点，禁止跨版本拼接真人标签。
message SnapshotRef {
  string task_id = 1;
  int64 task_revision = 2;
  int64 catalog_revision = 3;
  google.protobuf.Timestamp comment_cutoff = 4;
}
message GetChallengeTaskDescriptionRequest {
  SnapshotRef snapshot = 1;
}
message GetChallengeTaskDescriptionResponse {
  TaskDescription task = 1;
  bool visible = 2;
}
message ListChallengeWorksRequest {
  SnapshotRef snapshot = 1;
}
message ListChallengeWorksResponse {
  repeated Work works = 1;
  int64 catalog_revision = 2;
}
message ListChallengeCommentsRequest {
  SnapshotRef snapshot = 1;
}
message ListChallengeCommentsResponse {
  repeated Comment comments = 1;
  google.protobuf.Timestamp cutoff_at = 2;
}
message MaterialRef {
  string asset_id = 1;
  string source_kind = 2;
  string source_id = 3;
}
message CheckChallengeMaterialsRequest {
  string run_id = 1;
  SnapshotRef snapshot = 2;
  string purpose = 3;
  repeated string work_ids = 4;
  repeated MaterialRef materials = 5;
}
message CheckChallengeMaterialsResponse {
  bool allowed = 1;
  string authorization_version = 2;
}
message OpenRunRegistrationRequest {
  string run_id = 1;
  string task_id = 2;
  string administrator_id = 3;
  string executor_model = 4;
}
message OpenRunRegistrationResponse {
  string state = 1;
}
// 关闭必须写墓碑，先关闭再收到打开请求也不能恢复通道。
message CloseRunRegistrationRequest {
  string run_id = 1;
  string task_id = 2;
}
message CloseRunRegistrationResponse {
  string state = 1;
}
message RegistrationReceipt {
  string run_id = 1;
  string candidate_id = 2;
  string entry_id = 3;
  string review_id = 4;
  string review_state = 5;
  bool created = 6;
}
// 登记、通道状态检查和审核 outbox 必须在 Content 自己的事务中提交。
message RegisterChallengeCandidateRequest {
  string run_id = 1;
  string candidate_id = 2;
  string task_id = 3;
  string source_attempt_id = 4;
  Work work = 5;
  string executor_config_hash = 6;
}
message RegisterChallengeCandidateResponse {
  RegistrationReceipt receipt = 1;
}
message GetChallengeRegistrationRequest {
  string run_id = 1;
  string candidate_id = 2;
}
message GetChallengeRegistrationResponse {
  RegistrationReceipt receipt = 1;
}

// An immutable reviewed snapshot, separate from the author's editable draft.
enum ReviewedTaskState {
  REVIEWED_TASK_STATE_UNSPECIFIED = 0;
  REVIEWED_TASK_STATE_PUBLISHED = 1;
  REVIEWED_TASK_STATE_TAKEN_DOWN = 2;
}
enum ReviewedEntryState {
  REVIEWED_ENTRY_STATE_UNSPECIFIED = 0;
  REVIEWED_ENTRY_STATE_APPROVED = 1;
  REVIEWED_ENTRY_STATE_APPROVAL_REVOKED = 2;
}
message EntryAssetReview {
  string entry_id = 1;
  ReviewedEntryState state = 2;
}
// Legacy 3C compatibility only. Exact historical requests replay their receipts.
// First approval of an unsubmitted draft is now FailedPrecondition; formal
// submissions can only be tightened (taken down/revoked), not approved here.
// Existing legacy snapshots retain expected_revision serialization. mTLS
// moderation only; 2s, safe exact-request retry. Use ApplyReviewDecision for new cases.
message ApplyAssetReviewRequest {
  string decision_id = 1;
  string task_id = 2;
  int64 submission_revision = 3;
  int64 expected_revision = 4;
  oneof decision {
    ReviewedTaskState task_state = 5;
    EntryAssetReview entry_review = 6;
  }
}
message ReviewedEntry {
  string id = 1;
  int32 position = 2;
  ReviewedEntryState state = 3;
}
message ApplyAssetReviewResponse {
  int64 revision = 1;
  repeated ReviewedEntry entries = 2;
}
message CheckAssetAccessRequest {
  humanworth.asset.v1.PublicAssetReference reference = 1;
}
// allowed requires the exact file reference, a published task and approved entry.
// No owner bypass, no grant/cache. mTLS asset only; 2s; read-only safe retry.
message CheckAssetAccessResponse {
  bool allowed = 1;
  int64 revision = 2;
}

// Content owns this immutable initial-bundle submission, including stable entry IDs.
message ReviewSnapshot {
  string review_id = 1;
  TaskSubmission submission = 2;
  repeated string entry_ids = 3;
  google.protobuf.Timestamp created_at = 4;
}
message RequestTaskReviewRequest {
  string actor_assertion = 1;
  string task_id = 2;
  int64 expected_revision = 3;
  string asset_actor_assertion = 4;
}
message RequestTaskReviewResponse {
  TaskSubmission submission = 1;
}
message GetReviewSnapshotRequest {
  string review_id = 1;
}
message GetReviewSnapshotResponse {
  ReviewSnapshot snapshot = 1;
}
enum ReviewOutcome {
  REVIEW_OUTCOME_UNSPECIFIED = 0;
  REVIEW_OUTCOME_APPROVE = 1;
  REVIEW_OUTCOME_REJECT = 2;
}
message ApplyReviewDecisionRequest {
  string decision_id = 1;
  string review_id = 2;
  string task_id = 3;
  int64 submission_revision = 4;
  ReviewOutcome outcome = 5;
  optional string reason = 6;
}
message ApplyReviewDecisionResponse {
  string decision_id = 1;
  string review_id = 2;
  string state = 3;
  int64 revision = 4;
  repeated ReviewedEntry entries = 5;
}
message CheckReviewAssetAccessRequest {
  string actor_assertion = 1;
  string review_id = 2;
  string asset_id = 3;
}
message CheckReviewAssetAccessResponse {
  bool allowed = 1;
}

// Separate from TaskSubmission: no field/type/meaning changes to the task protocol.
message EntrySubmission {
  string id = 1;
  string task_id = 2;
  string author_id = 3;
  int64 revision = 4;
  // Server supplied; only additional is supported by this lifecycle.
  string origin = 5;
  // pending_review, approved, rejected or approval_revoked. No draft/public switch.
  string state = 6;
  EntryInput content = 7;
  string review_id = 8;
  optional string rejection_reason = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  google.protobuf.Timestamp approved_at = 12;
}
message SubmitAdditionalEntryRequest {
  string actor_assertion = 1;
  string task_id = 2;
  string idempotency_key = 3;
  EntryInput content = 4;
  string asset_actor_assertion = 5;
}
message SubmitAdditionalEntryResponse {
  EntrySubmission submission = 1;
}
message GetMyEntrySubmissionRequest {
  string actor_assertion = 1;
  string entry_id = 2;
}
message GetMyEntrySubmissionResponse {
  EntrySubmission submission = 1;
}
message ResubmitRejectedEntryRequest {
  string actor_assertion = 1;
  string entry_id = 2;
  int64 expected_revision = 3;
  EntryInput content = 4;
  string asset_actor_assertion = 5;
}
message ResubmitRejectedEntryResponse {
  EntrySubmission submission = 1;
}
message ListMyEntrySubmissionsRequest {
  string actor_assertion = 1;
  // Empty means all supported states; explicit draft/cloud/initial are rejected.
  string state = 2;
  int32 limit = 3;
  string cursor = 4;
  optional string category = 5;
}
message ListMyEntrySubmissionsResponse {
  repeated EntrySubmission items = 1;
  string next_cursor = 2;
}
message EntryReviewSnapshot {
  string review_id = 1;
  EntrySubmission submission = 2;
  google.protobuf.Timestamp created_at = 3;
}
message GetEntryReviewSnapshotRequest {
  string review_id = 1;
}
message GetEntryReviewSnapshotResponse {
  EntryReviewSnapshot snapshot = 1;
}
message ApplyEntryReviewDecisionRequest {
  string decision_id = 1;
  string review_id = 2;
  string task_id = 3;
  string entry_id = 4;
  int64 submission_revision = 5;
  ReviewOutcome outcome = 6;
  optional string reason = 7;
  // Lowercase hex SHA-256 of deterministic protobuf EntryReviewSnapshot bytes.
  string snapshot_sha256 = 8;
}
message ApplyEntryReviewDecisionResponse {
  string decision_id = 1;
  string review_id = 2;
  string entry_id = 3;
  int64 revision = 4;
  string state = 5;
}

// Content authority: distinct source, display, catalog and control generations.
message VotingCatalogSnapshot {
  string task_id = 1;
  int64 generation = 2;
  int64 task_revision = 3;
  int64 display_revision = 4;
  int64 catalog_revision = 5;
  // open, closed (irreversible takedown), or unpublished.
  string state = 6;
  repeated ApprovedEntry entries = 7;
  string sha256 = 8;
}
message GetVotingCatalogSnapshotRequest {
  string task_id = 1;
}
message GetVotingCatalogSnapshotResponse {
  VotingCatalogSnapshot catalog = 1;
}
message VotingAuthor {
  string id = 1;
  string display_name = 2;
}
message VotingArtifact {
  string kind = 1;
  string asset_id = 2;
  string url = 3;
  string text = 4;
}
message VotingEntry {
  string id = 1;
  string task_id = 2;
  string side = 3;
  string title = 4;
  string description = 5;
  string source = 6;
  repeated VotingArtifact artifacts = 7;
  VotingAuthor author = 8;
  google.protobuf.Timestamp approved_at = 9;
}
message VotingCatalog {
  string task_id = 1;
  int64 task_revision = 2;
  int64 catalog_revision = 3;
  bool visible = 4;
  repeated VotingEntry entries = 5;
  // SHA-256 of sorted entry IDs joined by newline; content is version-bound.
  string work_set_hash = 6;
}
message GetVotingCatalogRequest {
  string task_id = 1;
  // public or preference. Preference requires current cloud-use authorization
  // and recoverable material/comment versions for the exact snapshot below.
  string purpose = 2;
  SnapshotRef snapshot = 3;
  string run_id = 4;
}
message GetVotingCatalogResponse {
  VotingCatalog catalog = 1;
  bool preference_allowed = 2;
}

message TaskAttachmentInput {
  string asset_id = 1;
  optional bool cloud_use_allowed = 2;
}

message PublicComment {
  string id = 1;
  string task_id = 2;
  PublicAuthor author = 3;
  string body = 4;
  google.protobuf.Timestamp created_at = 5;
}
message ListCommentsRequest {
  string actor_assertion = 1;
  string task_id = 2;
  int32 limit = 3;
  string cursor = 4;
}
message ListCommentsResponse {
  repeated PublicComment items = 1;
  string next_cursor = 2;
}
message CreateCommentRequest {
  string actor_assertion = 1;
  string task_id = 2;
  string body = 3;
  string idempotency_key = 4;
}
message CreateCommentResponse {
  PublicComment comment = 1;
}
message ListDiscoverableTasksRequest {
  string order = 1;
  optional string category = 2;
  int32 limit = 3;
  string cursor = 4;
  optional string query = 5;
}
message ListDiscoverableTasksResponse {
  repeated PublicTask items = 1;
  string next_cursor = 2;
}
message CheckModerationTargetRequest {
  string target_kind = 1;
  string target_id = 2;
}
message CheckModerationTargetResponse {
  bool visible = 1;
  string task_id = 2;
}
message ApplyTakedownRequest {
  string decision_id = 1;
  string target_kind = 2;
  string target_id = 3;
}
message ApplyTakedownResponse {
  string decision_id = 1;
  string task_id = 2;
}
